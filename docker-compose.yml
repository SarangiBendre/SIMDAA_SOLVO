version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./simdaa_solvo.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://localhost
      - JWT_SECRET_KEY=change_this_to_a_long_random_string
    volumes:
      - backend-data:/app

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-data:
