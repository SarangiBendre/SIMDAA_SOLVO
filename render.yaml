# Render "Blueprint" for SIMDAA SOLVO.
#
# This file is OPTIONAL - it's here so you can redeploy both services
# from one definition if you ever want to. If you already have the
# backend and frontend deployed manually in the Render dashboard, you
# do NOT need to switch to this file. Instead, just add the rewrite
# rule below to your existing Static Site by hand:
#
#   Render dashboard -> your frontend static site -> Redirects/Rewrites
#     Source:      /*
#     Destination: /index.html
#     Action:      Rewrite
#
# That single rule is what fixes the "Not Found" page you get after
# refreshing on any route other than "/" (e.g. /dashboard, /questions/12).
# Render's static-site hosting looks for an actual file at that path by
# default; without a rewrite rule it has no way to know a client-side
# router (React Router) should handle it instead.

services:
  - type: web
    runtime: python
    name: simdaa-solvo-backend
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash

  - type: web
    runtime: static
    name: simdaa-solvo-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
